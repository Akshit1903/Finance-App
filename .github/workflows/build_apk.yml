name: Finance Release APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build_and_send:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x" # Uses latest stable Flutter 3 release
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file from GitHub Secrets
        run: |
          echo "SERVER_CLIENT_ID=${{ secrets.SERVER_CLIENT_ID }}" >> .env
          echo "HOME_SERVER_HOST=${{ secrets.HOME_SERVER_HOST }}" >> .env

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 -c 'import os, base64; open("android/app/upload-keystore.jks", "wb").write(base64.b64decode(os.environ["KEYSTORE_BASE64"]))'

      - name: Verify Keystore File
        run: ls -lh android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Build release APK
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          tag_name: ${{ github.run_number }}
          name: "Release Build ${{ github.run_number }}`"
          body: "Automated Flutter release APK build from GitHub Actions."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Email Notification with Links
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Finance Release Build Successful - Run #${{ github.run_number }}"
          body: |
            Download Finance Release APK Build #${{ github.run_number }}:

            📦 GitHub Release (Permanent):
            https://github.com/${{ github.repository }}/releases/tag/${{ github.run_number }}

            📥 GitHub Artifacts & Run Logs (Temporary):
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}

      - name: Send APK File to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          document: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          message: |
            Download Finance Release APK Build #${{ github.run_number }}:

            📦 GitHub Release (Permanent):
            https://github.com/${{ github.repository }}/releases/tag/${{ github.run_number }}

            📥 GitHub Artifacts & Run Logs (Temporary):
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
